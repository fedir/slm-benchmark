<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --mut:#777; --user:#e8f0fe; --bot:#f3f3f3; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#e8e8e8; --mut:#999; --user:#1e2a3d; --bot:#222; --line:#333; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); color:var(--mut); font-size:13px; }
  header select { font:inherit; background:transparent; color:inherit; border:1px solid var(--line); border-radius:6px; padding:2px 4px; }
  header input { flex:1; min-width:0; font:inherit; background:transparent; color:inherit; border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(46rem, 90%); padding:8px 12px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--user); }
  .bot { align-self:flex-start; background:var(--bot); }
  .think { color:var(--mut); font-size:13px; border-left:2px solid var(--line); padding-left:8px; margin-bottom:6px; }
  .stat { color:var(--mut); font-size:12px; align-self:flex-start; margin-top:-8px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; background:transparent; color:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-height:30vh; }
  button { font:inherit; padding:0 16px; border-radius:8px; border:1px solid var(--line); background:var(--bot); color:inherit; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span>Endpoint</span><input id="url" value="http://localhost:8080">
  <label>Thinking <select id="think">
    <option value="off">off</option><option value="128">low (128)</option><option value="512">medium (512)</option>
    <option value="2048">high (2048)</option><option value="-1">unlimited</option></select></label>
  <label>Max output <select id="maxtok">
    <option value="128">128</option><option value="512">512</option><option value="1024">1024</option>
    <option value="2048">2048</option><option value="4096">4096</option><option value="-1">no limit</option></select></label>
  <label>Sampling <select id="mode"><option value="general">general</option><option value="coding">precise coding</option></select></label>
  <button type="button" id="clear">Clear</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), send = $('send');
let history = [], ctrl = null;

// Ornith recommended sampling (model card): general vs precise coding
const SAMPLING = {
  general: { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5 },
  coding:  { temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0 },
};
$('think').value = 'off'; $('maxtok').value = '512';   // defaults
const saved = ['url', 'think', 'maxtok', 'mode'];
for (const k of saved) {
  try { const v = localStorage.getItem(k); if (v) { $(k).value = v; if ($(k).selectedIndex < 0) $(k).selectedIndex = 0; } } catch {}
  $(k).onchange = () => { try { localStorage.setItem(k, $(k).value); } catch {} };
}

function add(cls, text = '') {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

$('clear').onclick = () => { if (ctrl) ctrl.abort(); history = []; log.innerHTML = ''; };

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });

$('form').onsubmit = async e => {
  e.preventDefault();
  if (ctrl) { ctrl.abort(); return; }               // button acts as Stop while generating
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  history.push({ role: 'user', content: text });
  add('user', text);

  const box = add('bot');
  const think = document.createElement('div'); think.className = 'think'; think.hidden = true;
  const out = document.createElement('div');
  box.append(think, out);

  ctrl = new AbortController(); send.textContent = 'Stop';
  let reply = '', t0 = performance.now(), n = 0;
  try {
    const res = await fetch($('url').value.replace(/\/$/, '') + '/v1/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history, stream: true,
        ...SAMPLING[$('mode').value],
        max_tokens: +$('maxtok').value,   // counts thinking + answer
        chat_template_kwargs: { enable_thinking: $('think').value !== 'off' },
        ...($('think').value > 0 ? { thinking_budget_tokens: +$('think').value } : {}),
      }),
    });
    if (!res.ok) throw new Error(res.status + ' ' + await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data: ') || l.includes('[DONE]')) continue;
        const d = JSON.parse(l.slice(6)).choices?.[0]?.delta || {};
        if (d.reasoning_content) { think.hidden = false; think.textContent += d.reasoning_content; n++; }
        if (d.content) { reply += d.content; out.textContent = reply; n++; }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') out.textContent = (reply ? reply + '\n\n' : '') + '⚠ ' + err.message;
  }
  if (reply) history.push({ role: 'assistant', content: reply }); else history.pop();
  const s = document.createElement('div'); s.className = 'stat';
  s.textContent = n ? `${n} tokens · ${(n / ((performance.now() - t0) / 1000)).toFixed(1)} t/s` : '';
  log.appendChild(s);
  ctrl = null; send.textContent = 'Send'; input.focus();
};
</script>
</body>
</html>
